<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project | Jentech Consultants</title>
    <link rel="stylesheet" href="/css/pages.css" />
    <style>
        .project-hero-img {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, var(--navy-mid), var(--navy-light));
            object-fit: cover;
            display: block;
            position: relative;
            overflow: hidden;
        }
        
        @media (min-width: 768px) {
            .project-hero-img {
                height: 400px;
            }
        }
        
        .project-hero-img-wrap {
            position: relative;
            overflow: hidden;
            background: var(--navy-mid);
        }
        
        .project-hero-img-placeholder {
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--navy), var(--navy-light));
            font-family: var(--font-display);
            font-size: 96px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.04);
        }
        
        @media (min-width: 768px) {
            .project-hero-img-placeholder {
                height: 400px;
                font-size: 160px;
            }
        }
        /* Stats strip */
        
        .project-stats {
            background: var(--navy-mid);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        
        .project-stats-inner {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }
        
        @media (min-width: 480px) {
            .project-stats-inner {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (min-width: 768px) {
            .project-stats-inner {
                padding: 0 40px;
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        .pstat {
            padding: 24px 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        @media (min-width: 768px) {
            .pstat {
                padding: 28px 24px;
            }
        }
        
        .pstat:last-child {
            border-right: none;
        }
        
        .pstat-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
        }
        
        .pstat-value {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            color: var(--white);
            line-height: 1.2;
        }
        
        @media (min-width: 768px) {
            .pstat-value {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div id="navbarMount"></div>

    <section class="page-header" id="pageHero">
        <a href="/" class="back-home-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Home
        </a>
        <h1 id="heroTitle">Loading…</h1>
        <p id="heroSubtitle"></p>
    </section>

    <!-- Project image -->
    <div id="projectImageWrap" class="project-hero-img-wrap">
        <div class="project-hero-img-placeholder">J</div>
    </div>

    <!-- Stats strip -->
    <div class="project-stats" id="projectStats" style="display:none;">
        <div class="project-stats-inner" id="statsInner"></div>
    </div>

    <!-- Main content -->
    <section class="section">
        <div class="container">
            <a href="/pages/projects/" class="back-link">← Back to projects</a>
            <div id="mainContent">
                <div class="loading-wrap">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Related projects -->
    <section class="related-section" id="relatedSection" style="display:none;">
        <div class="container">
            <div class="section-header">
                <p class="eyebrow">More work</p>
                <h2 class="heading-lg">Related projects</h2>
            </div>
            <div class="cards-grid" id="relatedGrid" data-stagger></div>
        </div>
    </section>

    <div id="footerMount"></div>

    <script src="/js/shared.js"></script>
    <script>
        document.getElementById('navbarMount').innerHTML = renderNavbar('Projects');
        document.getElementById('footerMount').innerHTML = renderFooter();

        async function loadProject() {
            const slug = getSlugFromURL();
            const main = document.getElementById('mainContent');

            try {
                const p = await API.get(`/projects/${slug}`);

                document.title = `${p.title} | Jentech Consultants`;
                document.getElementById('heroTitle').textContent = p.title;
                document.getElementById('heroSubtitle').textContent = p.location || '';

                // Image
                const imgWrap = document.getElementById('projectImageWrap');
                if (p.image_url) {
                    imgWrap.innerHTML = `<img src="${p.image_url}" alt="${p.title}" class="project-hero-img">`;
                } else {
                    imgWrap.innerHTML = `<div class="project-hero-img-placeholder">${p.title.charAt(0)}</div>`;
                }

                // Stats strip
                const statsData = [{
                    label: 'Location',
                    value: p.location || 'Jamaica'
                }, {
                    label: 'Service type',
                    value: p.service_type || 'Engineering'
                }, {
                    label: 'Year',
                    value: p.year || '—'
                }, {
                    label: 'Status',
                    value: 'Completed'
                }].filter(s => s.value && s.value !== '—');

                if (statsData.length) {
                    document.getElementById('projectStats').style.display = 'block';
                    document.getElementById('statsInner').innerHTML = statsData.map(s => `
            <div class="pstat">
              <span class="pstat-label">${s.label}</span>
              <span class="pstat-value">${s.value}</span>
            </div>
          `).join('');
                }

                // Main content
                main.innerHTML = `
          <div class="detail-layout">
            <div data-reveal>
              ${p.featured ? `<span class="tag-pill" style="margin-bottom:20px;display:inline-block;">Featured Project</span>` : ''}
              <div class="rich-content">
                ${p.full_desc
                  ? p.full_desc
                  : `<p>${p.short_desc || 'Project details coming soon.'}</p>
                     <h2>Project overview</h2>
                     <p>This project is one of many delivered by the Jentech Group across Jamaica and the wider Caribbean region. Our team provided comprehensive engineering services from initial site investigation through to construction completion.</p>
                     <h2>Scope of work</h2>
                     <ul>
                       <li>${p.service_type || 'Civil engineering'} consultancy</li>
                       <li>Geotechnical investigations and reporting</li>
                       <li>Design and specification development</li>
                       <li>Construction supervision and quality control</li>
                     </ul>`
                }
              </div>
              <div style="margin-top:40px;">
                <a href="/#contact" class="btn btn-gold">Discuss a similar project</a>
              </div>
            </div>

            <aside class="detail-sidebar" data-reveal>
              <div class="sidebar-box">
                <p class="sidebar-box-title">Project info</p>
                ${p.location ? `<div class="sidebar-item"><span class="sidebar-label">Location</span><span class="sidebar-value">${p.location}</span></div>` : ''}
                ${p.service_type ? `<div class="sidebar-item"><span class="sidebar-label">Service</span><span class="sidebar-value">${p.service_type}</span></div>` : ''}
                ${p.year ? `<div class="sidebar-item"><span class="sidebar-label">Year</span><span class="sidebar-value">${p.year}</span></div>` : ''}
                <div class="sidebar-item"><span class="sidebar-label">Client</span><span class="sidebar-value">Confidential</span></div>
              </div>
              <div class="sidebar-box">
                <p class="sidebar-box-title">Start a project</p>
                <p style="font-size:14px;color:var(--gray-500);margin-bottom:20px;line-height:1.7;">Have a similar challenge? Our team in Jamaica and the US is ready to help.</p>
                <a href="/#contact" class="btn btn-gold" style="width:100%;justify-content:center;">Get in touch</a>
              </div>
            </aside>
          </div>
        `;

        loadRelated(slug, p.service_type);
        initReveal();

      } catch (err) {
        main.innerHTML = `
          <div class="empty-state">
            <h3>Project not found</h3>
            <a href="/pages/projects/" class="btn btn-gold" style="margin-top:24px;">View all projects</a>
          </div>`;
      }
    }

    async function loadRelated(currentSlug, type) {
      try {
        const all = await API.get('/projects');
        const related = all.filter(p => p.slug !== currentSlug && (!type || p.service_type === type)).slice(0, 3);
        if (!related.length) return;
        const section = document.getElementById('relatedSection');
        const grid = document.getElementById('relatedGrid');
        section.style.display = 'block';
        grid.innerHTML = related.map(p => `
          <a href="/pages/projects/${p.slug}.html" class="card">
            <div class="card-image">
              <div class="card-img-inner" style="background:linear-gradient(135deg,var(--navy),var(--navy-light));"></div>
            </div>
            <div class="card-body" style="padding-bottom:48px;">
              <p class="card-tag">${p.service_type || 'Engineering'}</p>
              <h3 class="card-title">${p.title}</h3>
              <p class="card-desc">${p.location || ''}</p>
              <div class="card-arrow">→</div>
            </div>
          </a>
        `).join('');
        initReveal();
      } catch (_) {}
    }

    loadProject();
    </script>
</body>

</html>
