<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Login | Jentech</title>
    <link rel="stylesheet" href="/css/pages.css" />
    <style>
        body {
            background: #060d14;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: var(--font-body);
        }
        
        .login-card {
            background: #0d1520;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        
        .login-title {
            font-family: var(--font-display);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            color: var(--white);
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 12px;
        }
        
        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-300);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        
        .auth-tab.active {
            background: var(--gold);
            color: var(--white);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-300);
            margin-bottom: 6px;
        }
        
        .form-control {
            width: 100%;
            background: #121b28;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            color: var(--white);
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--white);
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            background: var(--gold-light);
        }
        
        .error-msg {
            color: #ff4a4a;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        
        .success-msg {
            color: #4ade80;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        
        .auth-panel {
            display: none;
        }
        
        .auth-panel.active {
            display: block;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2 class="login-title">Jentech Portal</h2>

        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login" id="tabLogin">Sign in</button>
            <button class="auth-tab" data-tab="signup" id="tabSignup">Sign up</button>
        </div>

        <!-- ===== LOGIN PANEL ===== -->
        <div class="auth-panel active" id="panelLogin">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit">Login</button>
                <div id="errorMsg" class="error-msg"></div>
            </form>
        </div>

        <!-- ===== SIGN UP PANEL ===== -->
        <div class="auth-panel" id="panelSignup">
            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="suName" class="form-control" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="suEmail" class="form-control" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="suPassword" class="form-control" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="suPasswordConfirm" class="form-control" required autocomplete="new-password" minlength="6">
                </div>
                <button type="submit" class="btn-submit">Create account</button>
                <div id="signupErrorMsg" class="error-msg"></div>
                <div id="signupSuccessMsg" class="success-msg"></div>
            </form>
        </div>
    </div>

    <script src="/js/shared.js"></script>
    <script>
        // ---- Tab switching ----
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(tab === 'login' ? 'tabLogin' : 'tabSignup').classList.add('active');
            document.getElementById(tab === 'login' ? 'panelLogin' : 'panelSignup').classList.add('active');
        }
        document.getElementById('tabLogin').addEventListener('click', () => switchAuthTab('login'));
        document.getElementById('tabSignup').addEventListener('click', () => switchAuthTab('signup'));

        // ---- Login ----
        document.getElementById('loginForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            try {
                const res = await API.post('/auth/login', {
                    email,
                    password
                });
                if (res.success) {
                    window.location.href = '/pages/admin/index.html';
                } else {
                    errorMsg.textContent = res.error || 'Invalid credentials.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection failure to authentication server.';
                errorMsg.style.display = 'block';
            }
        });

        // ---- Sign up ---- (always creates an 'editor' account; ask an existing
        // admin to promote the account in the database if admin access is needed)
        document.getElementById('signupForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const name = document.getElementById('suName').value.trim();
            const email = document.getElementById('suEmail').value.trim();
            const password = document.getElementById('suPassword').value;
            const passwordConfirm = document.getElementById('suPasswordConfirm').value;
            const errorMsg = document.getElementById('signupErrorMsg');
            const successMsg = document.getElementById('signupSuccessMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (password !== passwordConfirm) {
                errorMsg.textContent = 'Passwords do not match.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const res = await API.post('/auth/register', {
                    name,
                    email,
                    password
                });
                if (res.success) {
                    successMsg.textContent = 'Account created! You can now sign in.';
                    successMsg.style.display = 'block';
                    document.getElementById('signupForm').reset();
                    setTimeout(() => {
                        switchAuthTab('login');
                        document.getElementById('email').value = email;
                    }, 1200);
                } else {
                    errorMsg.textContent = res.error || 'Could not create account.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection failure to authentication server.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
