    <style>
        :root {

        * {

        body {

            width: 100%;

            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .login-logo-mark {
            width: 38px;
            height: 38px;
            background: var(--gold);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;

            font-family: var(--font-display);

            font-weight: 700;
            color: var(--ink);
        }

        .login-sub {
            font-size: 11px;

            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: var(--paper);
            border: 1.5px solid var(--line);
            padding: 12px;
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            background: var(--white);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;

            border: none;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 13px;

            letter-spacing: 0.06em;
            cursor: pointer;

            margin-top: 6px;
        }

        .btn-submit:hover {
            background: var(--gold-dark);
        }

        .error-msg {
            color: #c0392b;
            font-size: 13px;
            margin-top: 14px;
            display: none;
        }

        .login-note {
            font-size: 12px;
            color: var(--ink-soft);
            margin-top: 20px;
            text-align: center;
            line-height: 1.6;
        }

        .login-note a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

        document.getElementById('loginForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
