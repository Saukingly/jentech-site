<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Login | Jentech</title>
    <link rel="stylesheet" href="/css/pages.css" />
    <style>
        body {
            background: #060d14;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: var(--font-body);
        }
        
        .login-card {
            background: #0d1520;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        
        .login-title {
            font-family: var(--font-display);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
            color: var(--white);
            border-bottom: 1px solid var(--gold-dim);
            padding-bottom: 12px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-300);
            margin-bottom: 6px;
        }
        
        .form-control {
            width: 100%;
            background: #121b28;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            color: var(--white);
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--white);
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        
        .btn-submit:hover {
            background: var(--gold-light);
        }
        
        .error-msg {
            color: #ff4a4a;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2 class="login-title">Jentech Portal</h2>
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Authenticate</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
    </div>

    <script src="/js/shared.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                // Talks directly to your backend authentication route
                const res = await API.post('/auth/login', {
                    email,
                    password
                });

                if (res.success) {
                    // Redirect straight to your dashboard upon success
                    window.location.href = '/pages/admin/index.html';
                } else {
                    errorMsg.textContent = res.error || 'Invalid credentials.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Connection failure to authentication server.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
