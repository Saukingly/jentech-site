<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services | Jentech Consultants</title>
    <link rel="stylesheet" href="/css/pages.css" />
    <style>
        .services-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2px;
        }
        
        @media (min-width: 600px) {
            .services-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (min-width: 960px) {
            .services-list {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        .service-card {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--off-white);
            padding: 36px 28px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
        }
        
        @media (min-width: 768px) {
            .service-card {
                padding: 48px 36px;
            }
        }
        
        .service-card::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 0;
            background: var(--gold);
            transition: height 0.4s;
        }
        
        .service-card:hover {
            background: var(--navy);
        }
        
        .service-card:hover::after {
            height: 100%;
        }
        
        .service-card:hover .sc-num {
            color: rgba(255, 255, 255, 0.05);
        }
        
        .service-card:hover .sc-title {
            color: var(--white);
        }
        
        .service-card:hover .sc-desc {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .service-card:hover .sc-link {
            color: var(--gold);
        }
        
        .service-card:hover .sc-icon {
            color: var(--gold);
            transform: scale(1.15);
        }
        
        .sc-num {
            position: absolute;
            top: 20px;
            right: 24px;
            font-family: var(--font-display);
            font-size: 80px;
            font-weight: 700;
            color: var(--gray-50);
            line-height: 1;
            pointer-events: none;
            transition: color 0.3s;
            user-select: none;
        }
        
        .sc-icon {
            color: var(--gold);
            margin-bottom: 20px;
            transition: color 0.3s, transform 0.4s;
        }
        
        .sc-title {
            font-family: var(--font-display);
            font-size: clamp(20px, 2.5vw, 24px);
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 12px;
            transition: color 0.3s;
        }
        
        .sc-desc {
            font-size: 14px;
            color: var(--gray-500);
            line-height: 1.75;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        
        .sc-link {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gray-300);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        
        .sc-link::after {
            content: '→';
        }
        /* Icons */
        
        .icon-svg {
            display: block;
        }
    </style>
</head>

<body>
    <div id="navbarMount"></div>

    <section class="page-header">
        <a href="/" class="back-home-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back to Home
        </a>
        <h1>Our Services</h1>
        <p>Comprehensive civil engineering services built for Jamaica, the Caribbean, and beyond.</p>
    </section>

    <!-- Services Grid -->
    <section class="section">
        <div class="container">
            <div id="servicesGrid" class="services-list" data-stagger>
                <div class="loading-wrap">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- CTA -->
    <section style="background:var(--navy);padding:64px 0;">
        <div class="container" style="text-align:center;" data-reveal>
            <p class="eyebrow" style="justify-content:center;">Ready to start?</p>
            <h2 class="heading-xl" style="color:var(--white);margin:12px 0 20px;">Have a project in mind?</h2>
            <p style="color:rgba(255,255,255,0.5);margin-bottom:32px;max-width:440px;margin-left:auto;margin-right:auto;font-size:15px;">Tell us about your engineering challenge and our team will be in touch.</p>
            <a href="/pages/contact/index.html" class="btn btn-gold">Get in touch</a>
        </div>
    </section>

    <div id="footerMount"></div>

    <script src="/js/shared.js"></script>
    <script>
        // Inject shared nav & footer
        document.getElementById('navbarMount').innerHTML = renderNavbar('Services');
        document.getElementById('footerMount').innerHTML = renderFooter();

        const icons = {
            'civil-structural-engineering': `<svg class="icon-svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/></svg>`,
            'geotechnical-exploration': `<svg class="icon-svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>`,
            'materials-soils-testing': `<svg class="icon-svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 0 1-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 0 1 4.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0 1 12 15a9.065 9.065 0 0 1-6.23-.693L4.2 13.9"/></svg>`,
            'project-management': `<svg class="icon-svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15"/></svg>`,
            'site-investigation': `<svg class="icon-svg" width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.4"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></svg>`
        };

        async function loadServices() {
            const grid = document.getElementById('servicesGrid');
            try {
                const services = await API.get('/services');
                if (!services.length) {
                    grid.innerHTML = '<div class="empty-state"><h3>No services found</h3><p>Check back soon.</p></div>';
                    return;
                }
                grid.innerHTML = services.map((s, i) => `
          <a href="/pages/services/${s.slug}" class="service-card">
            <span class="sc-num">${String(i + 1).padStart(2, '0')}</span>
            <div class="sc-icon">${icons[s.slug] || icons['civil-structural-engineering']}</div>
            <h3 class="sc-title">${s.title}</h3>
            <p class="sc-desc">${s.short_desc || ''}</p>
            <span class="sc-link">Learn more</span>
          </a>
        `).join('');
                // Re-init reveal for new elements
                initReveal();
            } catch (err) {
                // Changed 'empty-state' to 'error-container'
                grid.innerHTML = `
                    <div class="error-container">
                        <h2>Could not load services</h2>
                        <p>Please try again later.</p>
                    </div>
                `;
            }
        }

        loadServices();
    </script>
</body>

</html>
